<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Lector · Biblioteca Tuna</title><style>*{box-sizing:border-box}body{margin:0;background:#292526;color:#f7f2e7;font:14px system-ui}header{position:sticky;top:0;background:#171012;padding:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;z-index:1}button,input{background:#302226;color:#ead88f;border:1px solid #8b723d;border-radius:8px;padding:8px;font:inherit}button{cursor:pointer}button:disabled{opacity:.4}input{width:72px}#state{padding:8px;margin:0}#pages{overflow:auto;text-align:center;padding:8px}canvas{background:white;box-shadow:0 2px 12px #0008}label{white-space:nowrap}#total{white-space:nowrap}button:focus-visible,input:focus-visible{outline:2px solid #ead88f}</style></head><body><header><button id="prev" aria-label="Página anterior">‹</button><label>Página <input id="page" type="number" min="1" value="1"></label><span id="total"></span><button id="next" aria-label="Página siguiente">›</button><button id="less" aria-label="Reducir zoom">−</button><button id="more" aria-label="Aumentar zoom">+</button><button id="retry" hidden>Reintentar</button></header><p id="state" role="status">Cargando libro…</p><main id="pages"><canvas id="canvas" aria-label="Página del libro"></canvas></main><script type="module" src="/book-reader.js"></script></body></html>
