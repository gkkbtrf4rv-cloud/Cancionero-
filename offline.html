<!doctype html><html lang="es-MX"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#160f10"><title>Cancionero sin conexión</title><style>
*{box-sizing:border-box}body{margin:0;background:#160f10;color:#f5ead4;font:16px/1.5 system-ui,-apple-system,sans-serif}main{max-width:850px;margin:auto;padding:calc(22px + env(safe-area-inset-top)) 20px calc(40px + env(safe-area-inset-bottom))}h1{font:700 30px Georgia,serif;margin:8px 0}h2{font:700 25px Georgia,serif}small,.muted{color:#c1af93}button,input,a{font:inherit}button,a{color:#f0d493;background:#2c1c1d;border:1px solid #785a38;border-radius:12px;padding:12px;cursor:pointer}a{text-decoration:none;display:inline-block}input{width:100%;padding:13px;border-radius:12px;border:1px solid #785a38;background:#25191a;color:white;margin:20px 0 10px}#songs{display:grid;gap:9px}#songs button{text-align:left;width:100%}.bar{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}pre{font:14px/1.6 ui-monospace,Menlo,monospace;white-space:pre;overflow-x:auto;margin:0}.stanza{margin:22px 0}.chord{color:#e4bf68;font-weight:700}#sheet{padding:18px 0}#document iframe{width:100%;height:75vh;background:white;border:0}#document img{max-width:100%;height:auto}#error{padding:16px;border:1px solid #947449;border-radius:12px;margin:18px 0}[hidden]{display:none!important}
</style></head><body><main><small>TUNA DE DERECHO · FES ACATLÁN</small><h1>Cancionero</h1><p class="muted">Modo sin conexión · copia de este dispositivo</p><div class="bar"><button id="permission" disabled>Permiso de ensayo</button><a href="/">Volver a intentar conexión</a></div><p id="status" role="status">Abriendo copia guardada…</p><div id="error" hidden></div><section id="list"><input id="search" aria-label="Buscar canción" placeholder="Buscar canción…"><p id="count"></p><div id="songs"></div></section><section id="detail" hidden><button id="back">‹ Canciones</button><h2 id="title"></h2><div id="sheet"></div></section><section id="document" hidden><div class="bar"><button id="closeDoc">‹ Canciones</button><a id="openDoc" target="_blank" rel="noopener">Abrir documento</a></div><div id="documentBody"></div></section><noscript>Activa JavaScript para leer la copia guardada.</noscript></main><script>
(() => {
 const el=id=>document.getElementById(id);let songs=[],permission=null,user=null,objectUrl=null;
 const norm=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
 function error(message){el('error').hidden=false;el('error').textContent=message;el('status').textContent='No se pudo abrir la copia.';}
 function list(){el('detail').hidden=true;el('document').hidden=true;el('list').hidden=false;}
 function render(){const matches=songs.filter(s=>norm(s.titulo).includes(norm(el('search').value)));el('songs').replaceChildren();el('count').textContent=matches.length+' canciones';for(const s of matches){const b=document.createElement('button');b.textContent=s.titulo;b.onclick=()=>{el('list').hidden=true;el('detail').hidden=false;el('title').textContent=s.titulo;el('sheet').replaceChildren();for(const stanza of s.estrofas||[]){const section=document.createElement('div');section.className='stanza';for(const line of stanza){if(line.acordes){const p=document.createElement('pre');p.className='chord';p.textContent=line.acordes;section.append(p);}const p=document.createElement('pre');p.textContent=line.texto||'';section.append(p);}el('sheet').append(section);}window.scrollTo(0,0);};el('songs').append(b);}}
 el('search').oninput=render;el('back').onclick=list;el('closeDoc').onclick=list;
 el('permission').onclick=async()=>{try{const cache=await caches.open('cancionero-permission-v1-'+user.id);const r=await cache.match(permission.url);if(!r)throw Error('El permiso aún no está guardado. Conéctate y usa Cuenta → Guardar canciones y permiso.');const blob=await r.blob();if(!blob.size)throw Error('La copia del permiso está incompleta.');if(objectUrl)URL.revokeObjectURL(objectUrl);objectUrl=URL.createObjectURL(blob);const viewer=document.createElement(permission.mimeType==='application/pdf'?'iframe':'img');viewer.src=objectUrl;viewer.title='Permiso de ensayo guardado';el('documentBody').replaceChildren(viewer);el('openDoc').href=objectUrl;el('list').hidden=true;el('detail').hidden=true;el('document').hidden=false;}catch(e){error(e.message);}};
 (async()=>{try{user=JSON.parse(localStorage.getItem('cancionero_user_cache')||'null')?.user;if(!user?.approved||!localStorage.getItem('cancionero_token'))throw Error('No hay una sesión guardada en este acceso. Abre con internet desde este mismo icono e inicia sesión.');const cache=await caches.open('cancionero-private-offline-v1');const response=await cache.match('/__offline_snapshot__/'+encodeURIComponent(user.id));const data=response?await response.json():JSON.parse(localStorage.getItem('cancionero_offline_data_v1')||'null');if(!data||data.owner&&data.owner!==user.id||!data.canciones?.length)throw Error('No hay una copia de canciones en este acceso. Abre con internet desde este mismo icono y usa Cuenta → Guardar canciones y permiso.');songs=data.canciones;permission=data.permission;el('status').textContent='Copia del '+new Date(data.savedAt).toLocaleString('es-MX');if(permission){el('permission').disabled=false;}render();}catch(e){error(e.message||'No se pudo acceder a la copia.');}})();
})();
</script></body></html>
