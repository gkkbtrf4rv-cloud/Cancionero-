 function render(){const matches=songs.filter(s=>norm(s.titulo).includes(norm(el('search').value)));el('songs').replaceChildren();el('count').textContent=matches.length+(matches.length===1?' canción':' canciones');for(const s of matches){const b=document.createElement('button');b.setAttribute('aria-label',s.titulo);const icon=document.createElement('span');icon.className='song-icon';icon.textContent='♫';const copy=document.createElement('span');const name=document.createElement('span');name.className='song-name';name.textContent=s.titulo;const meta=document.createElement('span');meta.className='song-meta';meta.textContent=s.musica||'Letra y acordes';copy.append(name,meta);const arrow=document.createElement('span');arrow.className='chevron';arrow.textContent='›';b.append(icon,copy,arrow);b.onclick=()=>{document.body.classList.add('reading');el('list').hidden=true;el('detail').hidden=false;el('title').textContent=s.titulo;el('sheet').replaceChildren();for(const stanza of s.estrofas||[]){const section=document.createElement('div');section.className='stanza';for(const line of stanza){if(line.acordes){const p=document.createElement('pre');p.className='chord';p.textContent=line.acordes;section.append(p);}const p=document.createElement('pre');p.textContent=line.texto||'';section.append(p);}el('sheet').append(section);}window.scrollTo(0,0);};el('songs').append(b);}}
 el('search').oninput=render;el('back').onclick=list;el('closeDoc').onclick=list;
 el('navSongs').onclick=list;el('navPermission').onclick=()=>el('permission').click();
 el('permission').onclick=async()=>{try{const cache=await caches.open('cancionero-permission-v1-'+user.id);const r=await cache.match(permission.url);if(!r)throw Error('El permiso aún no está guardado. Conéctate y usa Cuenta → Guardar canciones y permiso.');const blob=await r.blob();if(!blob.size)throw Error('La copia del permiso está incompleta.');if(objectUrl)URL.revokeObjectURL(objectUrl);objectUrl=URL.createObjectURL(blob);const viewer=document.createElement(permission.mimeType==='application/pdf'?'iframe':'img');viewer.src=objectUrl;viewer.title='Permiso de ensayo guardado';el('documentBody').replaceChildren(viewer);el('openDoc').href=objectUrl;el('list').hidden=true;el('detail').hidden=true;el('document').hidden=false;document.body.classList.add('reading');el('navSongs').classList.remove('active');el('navPermission').classList.add('active');window.scrollTo(0,0);}catch(e){error(e.message);}};
 (async()=>{try{user=JSON.parse(localStorage.getItem('cancionero_user_cache')||'null')?.user;if(!user?.approved||!localStorage.getItem('cancionero_token'))throw Error('No hay una sesión guardada en este acceso. Abre con internet desde este mismo icono e inicia sesión.');const cache=await caches.open('cancionero-private-offline-v1');const response=await cache.match('/__offline_snapshot__/'+encodeURIComponent(user.id));const data=response?await response.json():JSON.parse(localStorage.getItem('cancionero_offline_data_v1')||'null');if(!data||data.owner&&data.owner!==user.id||!data.canciones?.length)throw Error('No hay una copia de canciones en este acceso. Abre con internet desde este mismo icono y usa Cuenta → Guardar canciones y permiso.');songs=data.canciones;permission=data.permission;el('status').textContent='Copia del '+new Date(data.savedAt).toLocaleString('es-MX');el('navPermission').disabled=!permission;if(permission){el('permission').disabled=false;}render();}catch(e){error(e.message||'No se pudo acceder a la copia.');}})();
})();
</script><script>/* Vino vibrante is the single visual identity, online and offline. */
(() => {
  const key = 'cancionero_theme_v1';
  function apply() {
    document.documentElement.dataset.theme = 'vino';
    document.documentElement.style.colorScheme = 'dark';
    document.body.dataset.theme = 'vino';
    document.body.classList.remove('theme-light', 'theme-dark');
    const meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', '#09090c');
  }
  apply();
  // Replace saved selections from the retired themes, without touching user data.
  try { localStorage.setItem(key, 'vino'); } catch {}
  window.addEventListener('storage', event => { if (event.key === key) apply(); });
})();
</script><script>/* Local glass controls: no network, pointer tracking, or continuous animation. */
(() => {
  const nav = document.querySelector('.premium-bottom-nav, .bottom-nav');
  if (!nav) return;
  let pending = false;
  function refresh() {
    pending = false;
    const active = nav.querySelector('button.active, a.active');
    if (!active || !nav.offsetWidth || !active.offsetWidth) return;
    const box = nav.getBoundingClientRect(), item = active.getBoundingClientRect();
    nav.style.setProperty('--glass-left', (item.left - box.left - nav.clientLeft) + 'px');
    nav.style.setProperty('--glass-width', item.width + 'px');
    if (!nav.classList.contains('glass-ready')) nav.classList.add('glass-ready');
  }
  function schedule() {
    if (pending) return;
    pending = true;
    requestAnimationFrame(refresh);
  }
  new MutationObserver(schedule).observe(nav, {subtree: true, attributes: true, attributeFilter: ['class']});
  if ('ResizeObserver' in window) new ResizeObserver(schedule).observe(nav);
  window.addEventListener('resize', schedule, {passive: true});
  window.addEventListener('pageshow', schedule);
  schedule();
})();
</script></body></html>
